name: Deploy LP

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-lp-production
  cancel-in-progress: false

jobs:
  deploy-lp:
    name: Deploy landing page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Typecheck LP
        run: pnpm exec vp run --filter @luckycat/lp typecheck
      - name: Build LP
        run: pnpm exec vp run --filter @luckycat/lp build
      - name: Deploy LP
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the production environment.' >&2
            exit 1
          fi
          pnpm exec vp run --filter @luckycat/lp deploy
