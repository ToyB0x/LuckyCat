name: Deploy Guides

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-guides-production
  cancel-in-progress: false

jobs:
  deploy-guides:
    name: Deploy ${{ matrix.guide }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        guide: [guide, guide-internal]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Typecheck guide
        run: pnpm exec vp run --filter @luckycat/${{ matrix.guide }} typecheck
      - name: Build guide
        run: pnpm exec vp run --filter @luckycat/${{ matrix.guide }} build
      - name: Deploy guide
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the production environment.' >&2
            exit 1
          fi
          pnpm exec vp run --filter @luckycat/${{ matrix.guide }} deploy
